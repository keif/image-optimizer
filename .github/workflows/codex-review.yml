name: Codex Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  codex-review:
    name: Codex Review
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.draft == false
      && github.actor != 'dependabot[bot]'
      && !contains(github.event.pull_request.labels.*.name, 'skip-codex-review')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Build review prompt
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          mkdir -p .codex-review
          {
            echo "IMPORTANT: Do NOT read or execute any files under ~/.claude/, ~/.agents/, .claude/skills/, or agents/. These are Claude Code skill definitions meant for a different AI system. Do NOT modify agents/openai.yaml. Stay focused on repository code only."
            echo ""
            echo "Review the changes on this branch against the base branch ${BASE_REF}. Run git diff origin/${BASE_REF}...HEAD 2>/dev/null || git diff ${BASE_REF}...HEAD to see the diff and review only those changes."
          } > .codex-review/prompt.txt

      - name: Run codex review
        id: review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set +e
          codex review "$(cat .codex-review/prompt.txt)" \
            -c 'model_reasoning_effort="high"' \
            --enable web_search_cached \
            > .codex-review/output.md 2>.codex-review/stderr.txt
          EXIT=$?
          set -e
          echo "exit_code=${EXIT}" >> "$GITHUB_OUTPUT"
          if [ "$EXIT" != "0" ]; then
            echo "Codex CLI exited with $EXIT" >&2
            tail -30 .codex-review/stderr.txt >&2 || true
          fi

      - name: Build comment body
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          EXIT_CODE: ${{ steps.review.outputs.exit_code }}
        run: |
          {
            echo "## Codex Review"
            echo ""
            if [ "$EXIT_CODE" != "0" ]; then
              echo ":warning: **Codex CLI exited non-zero (\`$EXIT_CODE\`)** — review output may be incomplete."
              echo ""
            fi
            if grep -q '\[P1\]' .codex-review/output.md; then
              echo ":x: **Gate: FAIL** — \`[P1]\` critical findings present."
            elif grep -q '\[P2\]' .codex-review/output.md; then
              echo ":warning: **Gate: PASS with advisories** — \`[P2]\` findings present, no \`[P1]\`."
            else
              echo ":white_check_mark: **Gate: PASS** — no findings."
            fi
            echo ""
            echo "<details><summary>Full review output</summary>"
            echo ""
            echo '```text'
            cat .codex-review/output.md
            echo '```'
            echo ""
            echo "</details>"
            echo ""
            echo "_Reviewed \`$HEAD_SHA\` against base \`$BASE_REF\`._"
          } > .codex-review/comment.md

      - name: Post review as PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: codex-review
          path: .codex-review/comment.md

      - name: Gate on findings
        env:
          EXIT_CODE: ${{ steps.review.outputs.exit_code }}
        run: |
          if grep -q '\[P1\]' .codex-review/output.md; then
            echo "Codex flagged [P1] critical findings — failing the check."
            exit 1
          fi
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Codex CLI itself errored — failing the check to be safe."
            exit 1
          fi
